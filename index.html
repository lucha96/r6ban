const BIN_ID  = '6a233e7bf5f4af5e29bff99a';
const BIN_KEY = '$2a$10$lM9wKM9/TqE2ndaPT.M3Uuy3OYRTmqmKodH9sAsp1qcel9GZ1VZzq';
const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
const BIN_H   = { 'Content-Type':'application/json', 'X-Master-Key': BIN_KEY };

async function dbGet() {
  const r = await fetch(`${BIN_URL}/latest`, { headers: BIN_H });
  if (!r.ok) throw new Error(`GET ${r.status}`);
  const j = await r.json();
  return j.record.votes || [];
}

async function dbPut(votes) {
  const r = await fetch(BIN_URL, {
    method: 'PUT',
    headers: BIN_H,
    body: JSON.stringify({ votes })
  });
  if (!r.ok) throw new Error(`PUT ${r.status}`);
}

async function dbSave(row) {
  // read → merge → write
  const votes = await dbGet();
  const idx = votes.findIndex(v => v.player === row.player && v.map === row.map);
  if (idx >= 0) votes[idx] = row;
  else votes.push(row);
  await dbPut(votes);
}

async function dbDelPlayer(player) {
  const votes = await dbGet();
  await dbPut(votes.filter(v => v.player !== player));
}

async function dbDelAll() {
  await dbPut([]);
}

    {id:'sentry',     nm:'Sentry',     org:'RBW',    i:'🟢'},
    {id:'skopos',     nm:'Skopós',     org:'EKAM',   i:'🤖'},
    {id:'denari',     nm:'Denari',     org:'SWCS',   i:'💎'},
  ]
};
const ALLOPS=[...OPS.atk,...OPS.def];
const SLOTS=[
  {key:'def_r1',lbl:'DEF BAN 1°',side:'def',color:'#ff3c3c'},
  {key:'def_r2',lbl:'DEF BAN 2°',side:'def',color:'#ff6b6b'},
  {key:'def_r3',lbl:'DEF BAN 3°',side:'def',color:'#ffaaaa'},
  {key:'atk_r1',lbl:'ATK BAN 1°',side:'atk',color:'#3aa8ff'},
  {key:'atk_r2',lbl:'ATK BAN 2°',side:'atk',color:'#6dc4ff'},
  {key:'atk_r3',lbl:'ATK BAN 3°',side:'atk',color:'#aaddff'},
];
const gop=id=>ALLOPS.find(o=>o.id===id);
const gmap=id=>MAPS.find(m=>m.id===id);
const gplayer=id=>PLAYERS.find(p=>p.id===id);

/* ── STATE ──────────────────────────────────── */
let me=null,selMaps=[],votes={},allVotes=[],vmi=0,vsi=0,resMap=null,pollId=null;

/* ── POLL ───────────────────────────────────── */
async function poll(){
  try{
    allVotes=await dbGet();
    const cur=document.querySelector('.screen.active');
    if(!cur)return;
    if(cur.id==='s-name')    syncPlayerBadges();
    if(cur.id==='s-maps')    syncMapBadges();
    if(cur.id==='s-results') renderResults();
    if(cur.id==='s-vote')    renderOpGrid();
  }catch(e){console.warn('poll',e.message);}
}
function startPoll(){if(pollId)clearInterval(pollId);pollId=setInterval(poll,5000);}

/* ── TOAST ──────────────────────────────────── */
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
}

/* ── SCREENS ────────────────────────────────── */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ── S1 NAME ────────────────────────────────── */
function buildPlayerGrid(){
  const g=document.getElementById('player-grid');
  const voted=new Set(allVotes.map(v=>v.player));
  g.innerHTML=PLAYERS.map(p=>`
    <button class="pbtn${me===p.id?' sel':''}" id="pb-${p.id}" onclick="pickPlayer('${p.id}')">
      ${voted.has(p.id)?'<span class="tick">✓</span>':''}${p.lbl}
    </button>`).join('');
}
function syncPlayerBadges(){
  const voted=new Set(allVotes.map(v=>v.player));
  PLAYERS.forEach(p=>{
    const btn=document.getElementById('pb-'+p.id);if(!btn)return;
    const has=!!btn.querySelector('.tick');
    if(voted.has(p.id)&&!has)btn.insertAdjacentHTML('afterbegin','<span class="tick">✓</span>');
    if(!voted.has(p.id)&&has)btn.querySelector('.tick').remove();
  });
}
function pickPlayer(id){
  me=id;
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.remove('sel'));
  document.getElementById('pb-'+id).classList.add('sel');
  document.getElementById('alert-name').style.display='none';
}
function onNameNext(){
  if(!me){document.getElementById('alert-name').style.display='block';return;}
  buildMapGrid();showScreen('s-maps');
}

/* ── S2 MAPS ────────────────────────────────── */
function buildMapGrid(){
  const myDone=new Set(allVotes.filter(v=>v.player===me).map(v=>v.map));
  document.getElementById('map-grid').innerHTML=MAPS.map(m=>{
    const done=myDone.has(m.id),sel=selMaps.includes(m.id);
    return `<div class="mcard${done?' done':sel?' sel':''}" id="mc-${m.id}" onclick="toggleMap('${m.id}')">
      ${done?'<span class="mcheck">✓</span>':''}
      <div class="map-em">${m.em}</div><div class="map-nm">${m.name}</div><div class="map-loc">${m.loc}</div>
    </div>`;
  }).join('');
}
function syncMapBadges(){buildMapGrid();}
function toggleMap(id){
  if(selMaps.includes(id))selMaps=selMaps.filter(x=>x!==id);else selMaps.push(id);
  const myDone=new Set(allVotes.filter(v=>v.player===me).map(v=>v.map));
  document.getElementById('mc-'+id).className='mcard'+(myDone.has(id)?' done':selMaps.includes(id)?' sel':'');
  document.getElementById('alert-maps').style.display='none';
}
function onMapsNext(){
  if(!selMaps.length){document.getElementById('alert-maps').style.display='block';return;}
  selMaps.forEach(mid=>{
    if(!votes[mid]){
      votes[mid]={};
      const ex=allVotes.find(v=>v.player===me&&v.map===mid);
      SLOTS.forEach(s=>{votes[mid][s.key]=ex?.[s.key]||null;});
    }
  });
  vmi=0;vsi=0;renderVoteScreen();showScreen('s-vote');
}

/* ── S3 VOTE ────────────────────────────────── */
function renderVoteScreen(){
  // map tabs
  document.getElementById('vote-map-tabs').innerHTML=selMaps.map((mid,i)=>{
    const m=gmap(mid);
    return `<div class="mtab${vmi===i?' active':''}" onclick="jumpMap(${i})">${mapDone(mid)?'✓ ':''}${m.em} ${m.name}</div>`;
  }).join('');
  // map chip
  const mc=gmap(selMaps[vmi]);
  document.getElementById('vote-map-chip').innerHTML=
    `<span style="font-size:20px">${mc.em}</span><span style="font-size:15px;font-weight:700;color:var(--white)">${mc.name}</span><span style="font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted);margin-left:auto">${mc.loc}</span>`;
  // slot tabs
  const cv=votes[selMaps[vmi]]||{};
  document.getElementById('slot-tabs').innerHTML=SLOTS.map((s,i)=>{
    const filled=!!cv[s.key],active=vsi===i;
    const style=active?`style="background:${s.color}22;color:${s.color};border-bottom:2px solid ${s.color}"`:(filled?`style="color:var(--gold)"`:'');
    return `<div class="stab${filled?' filled':''}${active?' cur':''}" ${style} onclick="jumpSlot(${i})">${filled?'●':'○'}<br>${s.lbl}</div>`;
  }).join('');
  // progress
  document.getElementById('prog-row').innerHTML=SLOTS.map(s=>
    `<div class="pdot" style="${cv[s.key]?`background:${s.color}`:''}"></div>`).join('');
  // slot bar
  const s=SLOTS[vsi];
  document.getElementById('slot-bar').style.border=`1px solid ${s.color}44`;
  document.getElementById('slot-bar').innerHTML=
    `<div style="width:8px;height:8px;border-radius:50%;background:${s.color};flex-shrink:0"></div>
     <span style="font-family:'Share Tech Mono',monospace;font-size:10px;font-weight:700;letter-spacing:2px;color:${s.color}">${s.lbl}</span>
     <span style="margin-left:auto;font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted)">${s.side==='def'?'🛡 Bannate un difensore':'⚔ Bannate un attaccante'}</span>`;
  // pick preview
  const pp=document.getElementById('pick-preview');
  const op=cv[s.key]?gop(cv[s.key]):null;
  if(!op){pp.style.display='none';}
  else{
    pp.style.cssText=`display:flex;align-items:center;gap:10px;padding:7px 10px;margin-bottom:8px;border:1px solid ${s.color}88;background:${s.color}11`;
    pp.innerHTML=`<span style="font-size:20px">${op.i}</span><span style="font-size:14px;font-weight:700;color:var(--white)">${op.nm}</span><span style="font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted)">${op.org}</span><span style="margin-left:auto;font-family:'Share Tech Mono',monospace;font-size:9px;color:${s.color}">✓ SELEZIONATO</span>`;
  }
  renderOpGrid();renderNavBtns();renderCounter();
}
function renderOpGrid(){
  const s=SLOTS[vsi],mid=selMaps[vmi],cv=votes[mid]||{};
  const banned=SLOTS.filter((x,i)=>i!==vsi&&x.side===s.side&&cv[x.key]).map(x=>cv[x.key]);
  const dbCounts={};
  allVotes.forEach(v=>{const op=v[s.key];if(op&&v.map===mid)dbCounts[op]=(dbCounts[op]||0)+1;});
  document.getElementById('op-grid').innerHTML=OPS[s.side].map(op=>{
    const isSel=cv[s.key]===op.id,isFade=banned.includes(op.id),cnt=dbCounts[op.id]||0;
    return `<div class="ocard${isSel?' sel':''}${isFade?' faded':''}" style="${isSel?`border-color:${s.color}`:''}" onclick="pickOp('${op.id}')">
      ${cnt>0?`<div style="position:absolute;top:2px;right:2px;background:${s.color};color:#000;font-family:'Share Tech Mono',monospace;font-size:8px;font-weight:700;width:13px;height:13px;display:flex;align-items:center;justify-content:center">${cnt}</div>`:''}
      <div class="oi">${op.i}</div><div class="on">${op.nm}</div><div class="oo">${op.org}</div>
    </div>`;
  }).join('');
}
function renderNavBtns(){
  const s=SLOTS[vsi];
  document.getElementById('btn-prev').disabled=(vmi===0&&vsi===0);
  const nb=document.getElementById('btn-next');
  nb.disabled=(vmi===selMaps.length-1&&vsi===SLOTS.length-1);
  nb.style.background=s.color;nb.style.color='#000';
}
function renderCounter(){
  const done=selMaps.reduce((a,mid)=>a+SLOTS.filter(s=>(votes[mid]||{})[s.key]).length,0);
  const total=selMaps.length*6,allOk=selMaps.every(mapDone);
  document.getElementById('btn-confirm').style.display=allOk?'block':'none';
  document.getElementById('slot-counter').textContent=allOk?'':`${done}/${total} slot completati`;
}
function mapDone(mid){const v=votes[mid]||{};return SLOTS.every(s=>v[s.key]);}
function jumpMap(i){vmi=i;vsi=0;renderVoteScreen();}
function jumpSlot(i){vsi=i;renderVoteScreen();}
function goSlot(dir){
  let si=vsi+dir,mi=vmi;
  if(si<0){mi--;si=SLOTS.length-1;}else if(si>=SLOTS.length){mi++;si=0;}
  if(mi<0||mi>=selMaps.length)return;
  vmi=mi;vsi=si;renderVoteScreen();
}
function pickOp(id){
  const s=SLOTS[vsi],mid=selMaps[vmi];
  if(!votes[mid])votes[mid]={};
  const banned=SLOTS.filter((x,i)=>i!==vsi&&x.side===s.side&&votes[mid][x.key]).map(x=>votes[mid][x.key]);
  if(banned.includes(id))return;
  votes[mid][s.key]=(votes[mid][s.key]===id)?null:id;
  renderVoteScreen();
}
async function saveAll(){
  const btn=document.getElementById('btn-confirm');
  btn.textContent='SALVATAGGIO...';btn.disabled=true;
  try{
    for(const mid of selMaps){
      await dbSave({player:me,map:mid,...votes[mid],updated_at:new Date().toISOString()});
    }
    await poll();
    toast('✓ Voti salvati!');
    goResults();
  }catch(e){
    console.error('saveAll',e);
    btn.textContent='✓ CONFERMA TUTTI I BAN';btn.disabled=false;
    toast('❌ Errore: '+e.message);
  }
}

/* ── S4 RESULTS ─────────────────────────────── */
function goResults(){renderResults();showScreen('s-results');}
function renderResults(){
  const allIds=new Set(allVotes.map(v=>v.player));
  const myDoneMaps=new Set(allVotes.filter(v=>v.player===me).map(v=>v.map));
  document.getElementById('res-voters').innerHTML=
    `<span class="label">Votanti</span>
     <div style="display:flex;gap:3px;flex-wrap:wrap">${PLAYERS.map(p=>`<div class="vav${allIds.has(p.id)?' on':''}" title="${p.lbl}">${p.id.substring(0,3).toUpperCase()}</div>`).join('')}</div>
     <span class="v-count">${allIds.size}/6</span>`;
  document.getElementById('btn-modifica').style.display=myDoneMaps.size>0?'':'none';
  const votedMaps=[...new Set(allVotes.map(v=>v.map))];
  if(!votedMaps.length){
    document.getElementById('res-map-tabs').innerHTML='';
    document.getElementById('res-content').innerHTML=`<div style="text-align:center;padding:36px;font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:3px">NESSUN VOTO ANCORA</div>`;
    return;
  }
  if(!resMap||!votedMaps.includes(resMap))resMap=votedMaps[0];
  document.getElementById('res-map-tabs').innerHTML=votedMaps.map(mid=>{
    const m=gmap(mid),n=allVotes.filter(v=>v.map===mid).length;
    return `<div class="mtab${resMap===mid?' active':''}" onclick="setResMap('${mid}')">${m.em} ${m.name} <span style="opacity:.5">(${n})</span></div>`;
  }).join('');
  const m=gmap(resMap);
  const mapVoters=allVotes.filter(v=>v.map===resMap).map(v=>v.player);
  const vavs=mapVoters.map(pid=>{const p=gplayer(pid);return `<div class="vav on" title="${p?.lbl||pid}">${pid.substring(0,3).toUpperCase()}</div>`;}).join('');
  let html=`<div class="res-map-card">
    <span style="font-size:24px">${m.em}</span>
    <div><div style="font-size:17px;font-weight:700;color:var(--white)">${m.name}</div><div style="font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted)">${mapVoters.length} VOTANTI · ${m.loc}</div></div>
    <div class="res-map-vavs">${vavs}</div>
  </div>`;
  SLOTS.forEach(slot=>{
    const ranking=getRanking(resMap,slot.key),maxCnt=ranking[0]?.cnt||1;
    html+=`<div class="slot-block">
      <div class="slot-block-hdr" style="background:${slot.color}11;border-left:3px solid ${slot.color}">
        <div style="width:7px;height:7px;border-radius:50%;background:${slot.color};flex-shrink:0"></div>
        <span style="font-family:'Share Tech Mono',monospace;font-size:9px;font-weight:700;letter-spacing:2px;color:${slot.color}">${slot.lbl}</span>
        <span style="margin-left:auto;font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--muted)">${slot.side==='def'?'🛡 DIFESA':'⚔ ATTACCO'}</span>
      </div>`;
    if(!ranking.length){html+=`<div class="no-votes">Nessun voto</div>`;}
    else ranking.forEach(({opId,cnt,voters},i)=>{
      const op=gop(opId);if(!op)return;
      html+=`<div class="rank-row" style="${i===0?`border-color:${slot.color}55`:''}">
        <div class="rank-n" style="${i===0?`color:${slot.color}`:''}">#${i+1}</div>
        <div class="rank-icon">${op.i}</div>
        <div class="rank-info">
          <div class="rank-name">${op.nm}</div>
          <div class="rank-who">${voters.join(', ')}</div>
          <div class="rank-bar"><div class="rank-fill" style="width:${(cnt/maxCnt)*100}%;background:${slot.color}"></div></div>
        </div>
        <div class="rank-cnt" style="color:${slot.color}">${cnt}</div>
      </div>`;
    });
    html+=`</div>`;
  });
  document.getElementById('res-content').innerHTML=html;
}
function getRanking(mid,key){
  const counts={},names={};
  allVotes.filter(v=>v.map===mid&&v[key]).forEach(v=>{
    const op=v[key];counts[op]=(counts[op]||0)+1;
    if(!names[op])names[op]=[];
    const p=gplayer(v.player);names[op].push(p?p.lbl:v.player);
  });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([opId,cnt])=>({opId,cnt,voters:names[opId]||[]}));
}
function setResMap(id){resMap=id;renderResults();}
async function onChangeVote(){
  if(me)await dbDelPlayer(me);
  votes={};await poll();buildMapGrid();showScreen('s-maps');
}
async function onReset(){
  if(!confirm('Reset completo? Cancella TUTTI i voti di tutti.'))return;
  await dbDelAll();allVotes=[];votes={};me=null;selMaps=[];
  buildPlayerGrid();showScreen('s-name');
}

/* ── BOOT ───────────────────────────────────── */
async function boot(){
  try{allVotes=await dbGet();}catch(e){console.warn('boot',e.message);}
  buildPlayerGrid();startPoll();
}
boot();
</script>
</body>
</html>
