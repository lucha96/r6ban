<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>R6 Ban Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ── RESET & ROOT ─────────────────────────────── */
:root {
  --bg:      #060810;
  --surface: #0c0f1a;
  --card:    #111520;
  --border:  #1a2035;
  --gold:    #e8b000;
  --gold2:   #ffc107;
  --red:     #ff3c3c;
  --red2:    #ff6b6b;
  --red3:    #ffaaaa;
  --blue:    #3aa8ff;
  --blue2:   #6dc4ff;
  --blue3:   #aaddff;
  --green:   #2dff7a;
  --text:    #b0bcd4;
  --muted:   #384560;
  --white:   #eef2ff;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Rajdhani', system-ui, sans-serif;
  min-height: 100dvh;
  padding: 12px 12px 32px;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse at 10% 50%, rgba(58,168,255,.05) 0%, transparent 50%),
    radial-gradient(ellipse at 90% 10%, rgba(232,176,0,.06) 0%, transparent 50%);
}
/* scanlines */
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.04) 0px, rgba(0,0,0,.04) 1px, transparent 1px, transparent 3px);
  pointer-events: none; z-index: 9999;
}

/* ── TYPOGRAPHY HELPERS ───────────────────────── */
.mono { font-family: 'Share Tech Mono', monospace; }
.label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 9px; letter-spacing: 3px; color: var(--muted);
  text-transform: uppercase;
}
.title { font-size: 17px; font-weight: 700; color: var(--white); margin-bottom: 14px; }

/* ── HEADER ───────────────────────────────────── */
.hdr {
  text-align: center;
  padding: 16px 12px 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  margin-bottom: 16px;
  position: relative; overflow: hidden;
}
.hdr-line {
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%);
  animation: hdr-sweep 5s ease-in-out infinite;
}
@keyframes hdr-sweep {
  0%,100% { transform: translateX(-100%); opacity: 0; }
  40%,60%  { transform: translateX(0%);   opacity: 1; }
}
.hdr-eyebrow { font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--gold); letter-spacing:4px; margin-bottom:4px; }
.hdr-logo { font-size: 28px; font-weight: 700; letter-spacing: 6px; color: var(--white); line-height:1; }
.hdr-logo em { color: var(--gold); font-style: normal; }
.hdr-sub { font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--muted); letter-spacing:2px; margin-top:5px; }
.live-dot {
  display: inline-block; width: 6px; height: 6px;
  background: var(--green); border-radius: 50%;
  margin-right: 5px; vertical-align: middle;
  animation: pulse 2s ease infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }

/* ── SCREENS ──────────────────────────────────── */
.screen { display: none; }
.screen.active { display: block; animation: fadein .22s ease; }
@keyframes fadein { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

/* ── PLAYER GRID ──────────────────────────────── */
.player-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px; margin-bottom: 14px;
}
.pbtn {
  position: relative;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 14px 10px;
  font-family: 'Rajdhani', sans-serif;
  font-size: 14px; font-weight: 700;
  cursor: pointer; text-align: center;
  line-height: 1.3; width: 100%;
  transition: border-color .15s, background .15s, color .15s;
  -webkit-tap-highlight-color: transparent;
}
.pbtn:active { transform: scale(.97); }
.pbtn:hover  { border-color: var(--gold); color: var(--gold); }
.pbtn.sel    { border-color: var(--gold); background: rgba(232,176,0,.1); color: var(--gold); }
.pbtn .tick  { position:absolute; top:5px; right:7px; font-size:10px; color:var(--green); }

/* ── MAP GRID ─────────────────────────────────── */
.map-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 7px; margin-bottom: 14px;
}
.mcard {
  position: relative;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 10px 6px 8px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.mcard::after {
  content:''; position:absolute; bottom:0; left:0; right:0; height:2px;
  background: var(--gold); transform:scaleX(0);
  transition: transform .2s ease;
}
.mcard.sel    { border-color: var(--gold); background: rgba(232,176,0,.07); }
.mcard.sel::after,
.mcard.done::after { transform: scaleX(1); }
.mcard.done   { border-color: var(--green); background: rgba(45,255,122,.05); }
.mcard.done::after { background: var(--green); }
.mcard:active { transform: scale(.96); }
.mcard .mcheck { position:absolute; top:4px; right:5px; font-size:10px; color:var(--green); }
.map-em  { font-size:18px; margin-bottom:3px; }
.map-nm  { font-size:10px; font-weight:700; color:var(--white); line-height:1.2; }
.map-loc { font-family:'Share Tech Mono',monospace; font-size:6px; color:var(--muted); margin-top:2px; }

/* ── SLOT TABS ────────────────────────────────── */
.slot-tabs {
  display: flex;
  border: 1px solid var(--border);
  margin-bottom: 10px;
  overflow: hidden;
}
.stab {
  flex: 1;
  padding: 8px 2px;
  text-align: center;
  font-family: 'Share Tech Mono', monospace;
  font-size: 7px; line-height: 1.5;
  cursor: pointer; color: var(--muted);
  border-right: 1px solid var(--border);
  background: var(--surface);
  transition: color .15s, background .15s;
  -webkit-tap-highlight-color: transparent;
}
.stab:last-child { border-right: none; }
.stab.filled { color: var(--gold); }
.stab.cur    { font-weight: 700; }

/* ── PROGRESS ─────────────────────────────────── */
.progress-row { display:flex; gap:3px; margin-bottom:10px; }
.pdot { flex:1; height:3px; background:var(--border); border-radius:2px; transition: background .3s; }

/* ── SLOT INFO BAR ────────────────────────────── */
.slot-bar {
  display: flex; align-items: center; gap:8px;
  padding: 8px 10px; margin-bottom:8px;
  background: var(--surface);
}
.slot-bar-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.slot-bar-name { font-family:'Share Tech Mono',monospace; font-size:10px; font-weight:700; letter-spacing:2px; }
.slot-bar-hint { margin-left:auto; font-family:'Share Tech Mono',monospace; font-size:8px; color:var(--muted); }

/* ── PICK PREVIEW ─────────────────────────────── */
.pick-row {
  display: flex; align-items: center; gap:10px;
  padding: 7px 10px; margin-bottom:8px;
}
.pick-icon { font-size:20px; }
.pick-name { font-size:14px; font-weight:700; color:var(--white); }
.pick-org  { font-family:'Share Tech Mono',monospace; font-size:8px; color:var(--muted); }
.pick-badge { margin-left:auto; font-family:'Share Tech Mono',monospace; font-size:9px; }

/* ── OP GRID ──────────────────────────────────── */
.op-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px; margin-bottom: 12px;
}
.ocard {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 8px 3px;
  cursor: pointer; text-align: center;
  transition: border-color .12s, background .12s, opacity .12s;
  -webkit-tap-highlight-color: transparent;
}
.ocard:active { transform: scale(.94); }
.ocard:hover  { border-color: var(--muted); }
.ocard.sel    { border-color: var(--gold); background: rgba(232,176,0,.12); }
.ocard.faded  { opacity: .2; pointer-events: none; }
.oi { font-size:15px; margin-bottom:2px; }
.on { font-size:8px; font-weight:700; color:var(--white); line-height:1.15; }
.oo { font-family:'Share Tech Mono',monospace; font-size:6px; color:var(--muted); margin-top:1px; }

/* ── MAP TAB ROW ──────────────────────────────── */
.map-tabs { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:12px; }
.mtab {
  padding: 5px 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-family: 'Share Tech Mono', monospace;
  font-size: 8px; color: var(--muted);
  cursor: pointer; transition: all .15s;
  -webkit-tap-highlight-color: transparent;
}
.mtab:hover { border-color:var(--muted); color:var(--text); }
.mtab.active { border-color:var(--gold); color:var(--gold); background:rgba(232,176,0,.08); }

/* ── BUTTONS ──────────────────────────────────── */
.btn {
  display: block; width: 100%;
  padding: 14px;
  background: var(--gold); color: #000;
  border: none;
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px; font-weight: 700; letter-spacing: 3px;
  cursor: pointer; transition: background .15s, transform .1s;
  -webkit-tap-highlight-color: transparent;
}
.btn:active    { transform: scale(.98); }
.btn:hover     { background: var(--gold2); }
.btn:disabled  { background: var(--border); color: var(--muted); cursor: not-allowed; }
.btn.ghost {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
}
.btn.ghost:hover { border-color:var(--muted); color:var(--text); background:transparent; }
.btn.danger {
  background: transparent;
  border: 1px solid rgba(255,60,60,.3);
  color: var(--red);
}
.btn.danger:hover { background: rgba(255,60,60,.08); }
.btn.sm { padding:10px 14px; font-size:12px; width:auto; }
.btn-row { display:flex; gap:8px; margin-top:8px; }

/* ── ALERT ────────────────────────────────────── */
.alert {
  background: rgba(255,60,60,.08);
  border: 1px solid rgba(255,60,60,.25);
  color: var(--red);
  padding: 9px 12px; font-size:12px; font-weight:600;
  letter-spacing:1px; margin-bottom:12px;
  display: none;
}

/* ── COUNTER ──────────────────────────────────── */
.counter {
  font-family:'Share Tech Mono',monospace;
  font-size:9px; color:var(--muted);
  text-align:center; margin-top:8px; letter-spacing:2px;
}

/* ── VOTERS BAR ───────────────────────────────── */
.voters-bar {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 9px 12px; margin-bottom:12px;
  display: flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.vav {
  width:26px; height:26px;
  border: 1px solid var(--border);
  background: #141820;
  display: flex; align-items:center; justify-content:center;
  font-family:'Share Tech Mono',monospace; font-size:7px; font-weight:700;
  color: var(--muted); transition: all .2s;
}
.vav.on { border-color:var(--green); color:var(--green); background:rgba(45,255,122,.1); }
.v-count { font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--muted); margin-left:auto; }

/* ── RESULTS ──────────────────────────────────── */
.res-map-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 11px 13px; margin-bottom:10px;
  display: flex; align-items:center; gap:10px;
}
.res-map-em   { font-size:24px; }
.res-map-name { font-size:17px; font-weight:700; color:var(--white); }
.res-map-sub  { font-family:'Share Tech Mono',monospace; font-size:8px; color:var(--muted); }
.res-map-vavs { display:flex; gap:3px; margin-left:auto; flex-wrap:wrap; }

.slot-block { margin-bottom:12px; }
.slot-block-hdr {
  display:flex; align-items:center; gap:8px;
  padding:6px 10px; margin-bottom:5px;
}
.sblk-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.sblk-lbl { font-family:'Share Tech Mono',monospace; font-size:9px; font-weight:700; letter-spacing:2px; }
.sblk-sub { margin-left:auto; font-family:'Share Tech Mono',monospace; font-size:8px; color:var(--muted); }

.rank-row {
  display:flex; align-items:center; gap:8px;
  padding:7px 10px;
  background: var(--card); border:1px solid var(--border);
  margin-bottom:3px;
}
.rank-n    { font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--muted); width:18px; flex-shrink:0; }
.rank-icon { font-size:18px; flex-shrink:0; }
.rank-info { flex:1; min-width:0; }
.rank-name { font-size:13px; font-weight:700; color:var(--white); }
.rank-who  { font-family:'Share Tech Mono',monospace; font-size:8px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rank-bar  { height:2px; background:var(--border); margin-top:3px; position:relative; overflow:hidden; }
.rank-fill { position:absolute; inset:0 auto 0 0; transition:width .6s ease; }
.rank-cnt  { font-family:'Share Tech Mono',monospace; font-size:15px; font-weight:700; flex-shrink:0; }
.no-votes  { font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--muted); padding:6px 10px; letter-spacing:2px; }

/* ── DIVIDER ──────────────────────────────────── */
.sep {
  font-family:'Share Tech Mono',monospace; font-size:8px;
  color:var(--muted); letter-spacing:3px;
  padding-bottom:7px; border-bottom:1px solid var(--border);
  margin-bottom:10px;
}

/* ── CURRENT MAP CHIP ─────────────────────────── */
.map-chip {
  display:flex; align-items:center; gap:8px;
  padding:8px 12px; margin-bottom:10px;
  background:var(--surface); border:1px solid var(--border);
}
.map-chip-em   { font-size:20px; }
.map-chip-name { font-size:15px; font-weight:700; color:var(--white); }
.map-chip-loc  { font-family:'Share Tech Mono',monospace; font-size:8px; color:var(--muted); margin-left:auto; }

/* ── TOAST ────────────────────────────────────── */
.toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--surface); border:1px solid var(--gold);
  color:var(--gold); font-family:'Share Tech Mono',monospace; font-size:11px;
  letter-spacing:2px; padding:10px 20px; z-index:10000;
  transition: transform .3s ease, opacity .3s ease; opacity:0;
  white-space:nowrap;
}
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
</style>
</head>

    {id:'fenrir',     nm:'Fenrir',     org:'UNAF',   i:'🐾'},

    {id:'denari',     nm:'Denari',     org:'SWCS',   i:'💎'},

const ALLOPS = [...OPS.atk, ...OPS.def];
const SLOTS = [
  { key:'def_r1', lbl:'DEF BAN 1°', side:'def', color:'#ff3c3c' },
  { key:'def_r2', lbl:'DEF BAN 2°', side:'def', color:'#ff6b6b' },
  { key:'def_r3', lbl:'DEF BAN 3°', side:'def', color:'#ffaaaa' },
  { key:'atk_r1', lbl:'ATK BAN 1°', side:'atk', color:'#3aa8ff' },
  { key:'atk_r2', lbl:'ATK BAN 2°', side:'atk', color:'#6dc4ff' },
  { key:'atk_r3', lbl:'ATK BAN 3°', side:'atk', color:'#aaddff' },
];

const gop = id => ALLOPS.find(o=>o.id===id);
const gmap = id => MAPS.find(m=>m.id===id);
const gplayer = id => PLAYERS.find(p=>p.id===id);

/* ── STATE ──────────────────────────────────────── */
let me       = null;    // player id
let selMaps  = [];      // selected map ids
let votes    = {};      // votes[mapId][slotKey] = opId
let allVotes = [];      // all DB rows
let vmi      = 0;       // vote screen: map index
let vsi      = 0;       // vote screen: slot index
let resMap   = null;    // results: active map
let pollId   = null;

/* ── POLL ───────────────────────────────────────── */
async function poll() {
  try {
    allVotes = await dbGet();
    const cur = document.querySelector('.screen.active');
    if (!cur) return;
    if (cur.id === 's-name')    syncPlayerBadges();
    if (cur.id === 's-maps')    syncMapBadges();
    if (cur.id === 's-results') renderResults();
    if (cur.id === 's-vote')    renderOpGrid();
  } catch(e) { console.warn('poll', e.message); }
}
function startPoll() { if (pollId) clearInterval(pollId); pollId = setInterval(poll, 4000); }

/* ── TOAST ──────────────────────────────────────── */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

/* ── SCREENS ────────────────────────────────────── */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ── S1: NAME ───────────────────────────────────── */
function buildPlayerGrid() {
  const g = document.getElementById('player-grid');
  const voted = new Set(allVotes.map(v=>v.player));
  g.innerHTML = PLAYERS.map(p => `
    <button class="pbtn${me===p.id?' sel':''}" id="pb-${p.id}" onclick="pickPlayer('${p.id}')">
      ${voted.has(p.id)?'<span class="tick">✓</span>':''}${p.lbl}
    </button>`).join('');
}
function syncPlayerBadges() {
  const voted = new Set(allVotes.map(v=>v.player));
  PLAYERS.forEach(p => {
    const btn = document.getElementById('pb-'+p.id);
    if (!btn) return;
    const has = !!btn.querySelector('.tick');
    if (voted.has(p.id) && !has) btn.insertAdjacentHTML('afterbegin','<span class="tick">✓</span>');
    if (!voted.has(p.id) && has) btn.querySelector('.tick').remove();
  });
}
function pickPlayer(id) {
  me = id;
  document.querySelectorAll('.pbtn').forEach(b => b.classList.remove('sel'));
  document.getElementById('pb-'+id).classList.add('sel');
  document.getElementById('alert-name').style.display = 'none';
}
function onNameNext() {
  if (!me) { document.getElementById('alert-name').style.display='block'; return; }
  buildMapGrid();
  showScreen('s-maps');
}

/* ── S2: MAPS ───────────────────────────────────── */
function buildMapGrid() {
  const myDone = new Set(allVotes.filter(v=>v.player===me).map(v=>v.map));
  const g = document.getElementById('map-grid');
  g.innerHTML = MAPS.map(m => {
    const done = myDone.has(m.id);
    const sel  = selMaps.includes(m.id);
    return `<div class="mcard${done?' done':sel?' sel':''}" id="mc-${m.id}" onclick="toggleMap('${m.id}')">
      ${done?'<span class="mcheck">✓</span>':''}
      <div class="map-em">${m.em}</div>
      <div class="map-nm">${m.name}</div>
      <div class="map-loc">${m.loc}</div>
    </div>`;
  }).join('');
}
function syncMapBadges() { buildMapGrid(); }
function toggleMap(id) {
  if (selMaps.includes(id)) selMaps = selMaps.filter(x=>x!==id);
  else selMaps.push(id);
  const myDone = new Set(allVotes.filter(v=>v.player===me).map(v=>v.map));
  const el = document.getElementById('mc-'+id);
  el.className = 'mcard' + (myDone.has(id)?' done': selMaps.includes(id)?' sel':'');
  document.getElementById('alert-maps').style.display='none';
}
function onMapsNext() {
  if (!selMaps.length) { document.getElementById('alert-maps').style.display='block'; return; }
  // init votes from DB if available
  selMaps.forEach(mid => {
    if (!votes[mid]) {
      votes[mid] = {};
      const ex = allVotes.find(v=>v.player===me&&v.map===mid);
      SLOTS.forEach(s => { votes[mid][s.key] = ex?.[s.key] || null; });
    }
  });
  vmi = 0; vsi = 0;
  renderVoteScreen();
  showScreen('s-vote');
}

/* ── S3: VOTE ───────────────────────────────────── */
function renderVoteScreen() {
  renderVoteMapTabs();
  renderVoteMapChip();
  renderSlotTabs();
  renderProgress();
  renderSlotBar();
  renderPickPreview();
  renderOpGrid();
  renderNavBtns();
  renderCounter();
}

function renderVoteMapTabs() {
  document.getElementById('vote-map-tabs').innerHTML = selMaps.map((mid,i) => {
    const m = gmap(mid);
    return `<div class="mtab${vmi===i?' active':''}" onclick="jumpMap(${i})">${mapDone(mid)?'✓ ':''}${m.em} ${m.name}</div>`;
  }).join('');
}
function renderVoteMapChip() {
  const m = gmap(selMaps[vmi]);
  document.getElementById('vote-map-chip').innerHTML =
    `<span class="map-chip-em">${m.em}</span><span class="map-chip-name">${m.name}</span><span class="map-chip-loc">${m.loc}</span>`;
}
function renderSlotTabs() {
  const cv = votes[selMaps[vmi]]||{};
  document.getElementById('slot-tabs').innerHTML = SLOTS.map((s,i) => {
    const filled = !!cv[s.key];
    const active = vsi===i;
    const style  = active ? `style="background:${s.color}22;color:${s.color};border-bottom:2px solid ${s.color}"` : (filled?`style="color:var(--gold)"` : '');
    return `<div class="stab${filled?' filled':''}${active?' cur':''}" ${style} onclick="jumpSlot(${i})">${filled?'●':'○'}<br>${s.lbl}</div>`;
  }).join('');
}
function renderProgress() {
  const cv = votes[selMaps[vmi]]||{};
  document.getElementById('prog-row').innerHTML = SLOTS.map((s,i) =>
    `<div class="pdot" style="${cv[s.key]?`background:${s.color}`:''}" ></div>`
  ).join('');
}
function renderSlotBar() {
  const s = SLOTS[vsi];
  document.getElementById('slot-bar').style.border = `1px solid ${s.color}44`;
  document.getElementById('slot-bar').innerHTML =
    `<div class="slot-bar-dot" style="background:${s.color}"></div>
     <span class="slot-bar-name" style="color:${s.color}">${s.lbl}</span>
     <span class="slot-bar-hint">${s.side==='def'?'🛡 Bannate un difensore':'⚔ Bannate un attaccante'}</span>`;
}
function renderPickPreview() {
  const s  = SLOTS[vsi];
  const cv = votes[selMaps[vmi]]||{};
  const pp = document.getElementById('pick-preview');
  const op = cv[s.key] ? gop(cv[s.key]) : null;
  if (!op) { pp.style.display='none'; return; }
  pp.style.cssText = `display:flex;align-items:center;gap:10px;padding:7px 10px;margin-bottom:8px;border:1px solid ${s.color}88;background:${s.color}11`;
  pp.innerHTML = `<span class="pick-icon">${op.i}</span><span class="pick-name">${op.nm}</span><span class="pick-org">${op.org}</span><span class="pick-badge" style="color:${s.color}">✓ SELEZIONATO</span>`;
}
function renderOpGrid() {
  const s  = SLOTS[vsi];
  const cv = votes[selMaps[vmi]]||{};
  const banned = SLOTS.filter((x,i)=>i!==vsi&&x.side===s.side&&cv[x.key]).map(x=>cv[x.key]);
  // also show other votes from DB as badges
  const dbCounts = {};
  allVotes.forEach(v => { const op=v[s.key]; if(op&&v.map===selMaps[vmi]) dbCounts[op]=(dbCounts[op]||0)+1; });

  document.getElementById('op-grid').innerHTML = OPS[s.side].map(op => {
    const isSel  = cv[s.key]===op.id;
    const isFade = banned.includes(op.id);
    const cnt    = dbCounts[op.id]||0;
    return `<div class="ocard${isSel?' sel':''}${isFade?' faded':''}"
      style="${isSel?`border-color:${s.color}`:''}"
      onclick="pickOp('${op.id}')">
      ${cnt>0?`<div style="position:absolute;top:2px;right:2px;background:${s.color};color:#000;font-family:'Share Tech Mono',monospace;font-size:8px;font-weight:700;width:13px;height:13px;display:flex;align-items:center;justify-content:center">${cnt}</div>`:''}
      <div class="oi">${op.i}</div>
      <div class="on">${op.nm}</div>
      <div class="oo">${op.org}</div>
    </div>`;
  }).join('');
}
function renderNavBtns() {
  const s = SLOTS[vsi];
  document.getElementById('btn-prev').disabled = (vmi===0&&vsi===0);
  const nb = document.getElementById('btn-next');
  nb.disabled = (vmi===selMaps.length-1&&vsi===SLOTS.length-1);
  nb.style.background = s.color;
  nb.style.color = '#000';
}
function renderCounter() {
  const done  = selMaps.reduce((a,mid)=>a+SLOTS.filter(s=>(votes[mid]||{})[s.key]).length,0);
  const total = selMaps.length*6;
  const allOk = selMaps.every(mapDone);
  document.getElementById('btn-confirm').style.display = allOk?'block':'none';
  document.getElementById('slot-counter').textContent  = allOk?'':`${done}/${total} slot completati`;
}
function mapDone(mid) { const v=votes[mid]||{}; return SLOTS.every(s=>v[s.key]); }
function jumpMap(i)  { vmi=i; vsi=0; renderVoteScreen(); }
function jumpSlot(i) { vsi=i; renderVoteScreen(); }
function goSlot(dir) {
  let si=vsi+dir, mi=vmi;
  if (si<0)           { mi--; si=SLOTS.length-1; }
  else if(si>=SLOTS.length) { mi++; si=0; }
  if (mi<0||mi>=selMaps.length) return;
  vmi=mi; vsi=si;
  renderVoteScreen();
}
function pickOp(id) {
  const s  = SLOTS[vsi];
  const mid = selMaps[vmi];
  if (!votes[mid]) votes[mid]={};
  const banned = SLOTS.filter((x,i)=>i!==vsi&&x.side===s.side&&votes[mid][x.key]).map(x=>votes[mid][x.key]);
  if (banned.includes(id)) return;
  votes[mid][s.key] = (votes[mid][s.key]===id) ? null : id;
  renderVoteScreen();
}

async function saveAll() {
  const btn = document.getElementById('btn-confirm');
  btn.textContent = 'SALVATAGGIO...';
  btn.disabled = true;
  try {
    for (const mid of selMaps) {
      await dbSave({ player:me, map:mid, ...votes[mid], updated_at:new Date().toISOString() });
    }
    await poll();
    toast('✓ Voti salvati!');
    goResults();
  } catch(e) {
    console.error('saveAll', e);
    btn.textContent = '✓ CONFERMA TUTTI I BAN';
    btn.disabled = false;
    toast('❌ Errore: ' + e.message);
  }
}

/* ── S4: RESULTS ────────────────────────────────── */
function goResults() {
  renderResults();
  showScreen('s-results');
}
function renderResults() {
  const allIds    = new Set(allVotes.map(v=>v.player));
  const myDoneMaps = new Set(allVotes.filter(v=>v.player===me).map(v=>v.map));

  // voters bar
  document.getElementById('res-voters').innerHTML =
    `<span class="label">Votanti</span>
     <div style="display:flex;gap:3px;flex-wrap:wrap">${PLAYERS.map(p=>`<div class="vav${allIds.has(p.id)?' on':''}" title="${p.lbl}">${p.id.substring(0,3).toUpperCase()}</div>`).join('')}</div>
     <span class="v-count">${allIds.size}/6</span>`;

  document.getElementById('btn-modifica').style.display = myDoneMaps.size>0?'':'none';

  const votedMaps = [...new Set(allVotes.map(v=>v.map))];
  if (!votedMaps.length) {
    document.getElementById('res-map-tabs').innerHTML = '';
    document.getElementById('res-content').innerHTML =
      `<div style="text-align:center;padding:36px;font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:3px">NESSUN VOTO ANCORA</div>`;
    return;
  }
  if (!resMap || !votedMaps.includes(resMap)) resMap = votedMaps[0];

  document.getElementById('res-map-tabs').innerHTML = votedMaps.map(mid => {
    const m = gmap(mid);
    const n = allVotes.filter(v=>v.map===mid).length;
    return `<div class="mtab${resMap===mid?' active':''}" onclick="setResMap('${mid}')">${m.em} ${m.name} <span style="opacity:.5">(${n})</span></div>`;
  }).join('');

  const m = gmap(resMap);
  const mapVoters = allVotes.filter(v=>v.map===resMap).map(v=>v.player);
  const vavs = mapVoters.map(pid => {
    const p=gplayer(pid);
    return `<div class="vav on" title="${p?.lbl||pid}">${pid.substring(0,3).toUpperCase()}</div>`;
  }).join('');

  let html = `<div class="res-map-card">
    <span class="res-map-em">${m.em}</span>
    <div><div class="res-map-name">${m.name}</div><div class="res-map-sub">${mapVoters.length} VOTANTI · ${m.loc}</div></div>
    <div class="res-map-vavs">${vavs}</div>
  </div>`;

  SLOTS.forEach(slot => {
    const ranking = getRanking(resMap, slot.key);
    const maxCnt  = ranking[0]?.cnt||1;
    html += `<div class="slot-block">
      <div class="slot-block-hdr" style="background:${slot.color}11;border-left:3px solid ${slot.color}">
        <div class="sblk-dot" style="background:${slot.color}"></div>
        <span class="sblk-lbl" style="color:${slot.color}">${slot.lbl}</span>
        <span class="sblk-sub">${slot.side==='def'?'🛡 DIFESA':'⚔ ATTACCO'}</span>
      </div>`;
    if (!ranking.length) {
      html += `<div class="no-votes">Nessun voto</div>`;
    } else {
      ranking.forEach(({opId,cnt,voters},i) => {
        const op  = gop(opId); if(!op) return;
        const pct = (cnt/maxCnt)*100;
        html += `<div class="rank-row" style="${i===0?`border-color:${slot.color}55`:''}">
          <div class="rank-n" style="${i===0?`color:${slot.color}`:''}">#${i+1}</div>
          <div class="rank-icon">${op.i}</div>
          <div class="rank-info">
            <div class="rank-name">${op.nm}</div>
            <div class="rank-who">${voters.join(', ')}</div>
            <div class="rank-bar"><div class="rank-fill" style="width:${pct}%;background:${slot.color}"></div></div>
          </div>
          <div class="rank-cnt" style="color:${slot.color}">${cnt}</div>
        </div>`;
      });
    }
    html += `</div>`;
  });

  document.getElementById('res-content').innerHTML = html;
}
function getRanking(mid, key) {
  const counts={}, names={};
  allVotes.filter(v=>v.map===mid&&v[key]).forEach(v => {
    const op=v[key];
    counts[op]=(counts[op]||0)+1;
    if(!names[op]) names[op]=[];
    const p=gplayer(v.player);
    names[op].push(p?p.lbl:v.player);
  });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([opId,cnt])=>({opId,cnt,voters:names[opId]||[]}));
}
function setResMap(id) { resMap=id; renderResults(); }

async function onChangeVote() {
  if (me) await dbDelPlayer(me);
  votes = {};
  await poll();
  buildMapGrid();
  showScreen('s-maps');
}
async function onReset() {
  if (!confirm('Reset completo? Cancella TUTTI i voti di tutti.')) return;
  await dbDelAll();
  allVotes=[]; votes={}; me=null; selMaps=[];
  buildPlayerGrid();
  showScreen('s-name');
}

/* ── BOOT ───────────────────────────────────────── */
async function boot() {
  try { allVotes = await dbGet(); } catch(e) { console.warn('boot', e.message); }
  buildPlayerGrid();
  startPoll();
}
boot();
</script>
